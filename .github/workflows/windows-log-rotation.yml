name: Temporary Windows log rotation regression

# Fork-only evidence for PR #6366; remove before upstream merge.
on:
  push:
    branches: [fix/log-rollover-recovery]

permissions:
  contents: read

jobs:
  windows-log-rotation:
    if: github.repository == 'rjdotdev/OpenViking'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Python logging tests do not exercise the C++ engine, Rust CLI/RAGFS,
      # or Studio. Use setup.py's supported skips, not fake native modules.
      OV_SKIP_CPP_BUILD: '1'
      OV_SKIP_OV_BUILD: '1'
      OV_SKIP_RAGFS_BUILD: '1'
      OV_SKIP_STUDIO_BUILD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v7

      - name: Install locked dependencies and editable source (native builds skipped)
        run: uv sync --frozen --extra test

      - name: Verify real Windows and checkout imports
        shell: pwsh
        run: |
          @'
          import os
          import platform
          from pathlib import Path
          from openviking_cli.utils import logger, log_rotation
          from openviking.usage_reporter import file_log_sink

          assert os.name == "nt", platform.platform()
          root = Path.cwd().resolve()
          print(f"Platform: {platform.platform()}")
          for module in (logger, log_rotation, file_log_sink):
              location = Path(module.__file__).resolve()
              print(f"{module.__name__}: {location}")
              assert location.is_relative_to(root), location
          '@ | uv run --frozen --no-sync python -

      - name: Prove native rotation regression fails on original PR base
        shell: pwsh
        run: |
          @'
          import shutil
          import subprocess
          import sys
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path.cwd()
          base = root.parent / "windows-log-rotation-base"
          subprocess.run(["git", "worktree", "add", "--detach", str(base), "03b9aec"], check=True)
          try:
              shutil.copy2(root / "tests/test_logger_rotation.py", base / "tests/test_logger_rotation.py")
              check = "from pathlib import Path; from openviking_cli.utils import logger; " + \
                      "assert Path(logger.__file__).resolve().is_relative_to(Path.cwd())"
              subprocess.run([sys.executable, "-c", check], cwd=base, check=True)
              result = subprocess.run([
                  sys.executable, "-m", "pytest", "-q", "-ra", "-o", "addopts=",
                  "tests/test_logger_rotation.py::test_windows_worker_processes_keep_post_rollover_records_out_of_backup",
                  "--junitxml=" + str(root / "windows-log-rotation-base.xml"),
              ], cwd=base, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print(result.stdout)
              (root / "windows-log-rotation-base.log").write_text(result.stdout, encoding="utf-8")
              cases = ET.parse(root / "windows-log-rotation-base.xml").findall(".//testcase")
              assert result.returncode == 1, result.returncode
              assert len(cases) == 1 and cases[0].find("failure") is not None
              assert cases[0].find("error") is None and cases[0].find("skipped") is None
              failure = cases[0].find("failure").text or ""
              assert any(check in failure for check in (
                  "assert len(backups) == 1",
                  "assert sorted(backups[0].read_text().splitlines())",
                  "assert sorted(path.read_text().splitlines())",
              )), failure
          finally:
              subprocess.run(["git", "worktree", "remove", "--force", str(base)], check=True)
          '@ | uv run --frozen --no-sync python -

      - name: Run existing focused regressions with normal conftest
        run: >-
          uv run --frozen --no-sync pytest -q -ra -o addopts=''
          tests/test_logger_rotation.py
          tests/unit/usage_reporter/test_file_log_sink.py
          --junitxml=windows-log-rotation.xml

      - name: Require native Windows tests to execute and pass
        if: always()
        shell: pwsh
        run: |
          @'
          import xml.etree.ElementTree as ET

          cases = ET.parse("windows-log-rotation.xml").findall(".//testcase")
          for name in (
              "test_windows_worker_processes_keep_post_rollover_records_out_of_backup",
              "test_native_process_lock_excludes_other_processes",
          ):
              matches = [case for case in cases if case.get("name") == name]
              assert len(matches) == 1 and len(matches[0]) == 0, name
          '@ | uv run --frozen --no-sync python -

      - name: Upload pytest JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-log-rotation-${{ github.sha }}
          path: |
            windows-log-rotation.xml
            windows-log-rotation-base.xml
            windows-log-rotation-base.log
          if-no-files-found: warn
