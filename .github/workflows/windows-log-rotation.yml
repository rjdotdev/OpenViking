name: Temporary Windows log rotation regression

# Fork-only evidence for PR #6366; remove before upstream merge.
on:
  push:
    branches: [fix/log-rollover-recovery]

permissions:
  contents: read

jobs:
  windows-log-rotation:
    if: github.repository == 'rjdotdev/OpenViking'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Python logging tests do not exercise the C++ engine, Rust CLI/RAGFS,
      # or Studio. Use setup.py's supported skips, not fake native modules.
      OV_SKIP_CPP_BUILD: '1'
      OV_SKIP_OV_BUILD: '1'
      OV_SKIP_RAGFS_BUILD: '1'
      OV_SKIP_STUDIO_BUILD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v7

      - name: Install locked dependencies and editable source (native builds skipped)
        run: uv sync --frozen --extra test

      - name: Verify real Windows and checkout imports
        shell: pwsh
        run: |
          @'
          import os
          import platform
          from pathlib import Path
          from openviking_cli.utils import logger, log_rotation
          from openviking.usage_reporter import file_log_sink

          assert os.name == "nt", platform.platform()
          root = Path.cwd().resolve()
          print(f"Platform: {platform.platform()}")
          for module in (logger, log_rotation, file_log_sink):
              location = Path(module.__file__).resolve()
              print(f"{module.__name__}: {location}")
              assert location.is_relative_to(root), location
          '@ | uv run --frozen --no-sync python -

      - name: Run existing focused regressions with normal conftest
        run: >-
          uv run --frozen --no-sync pytest -q -o addopts=''
          tests/test_logger_rotation.py
          tests/unit/usage_reporter/test_file_log_sink.py
          --junitxml=windows-log-rotation.xml

      - name: Upload pytest JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-log-rotation-${{ github.sha }}
          path: windows-log-rotation.xml
          if-no-files-found: warn
