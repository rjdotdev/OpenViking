name: Temporary macOS log rotation regression

# Fork-only evidence for PR #6366; remove before upstream merge.
on:
  push:
    branches: [fix/log-rollover-recovery]

permissions:
  contents: read

jobs:
  macos-log-rotation:
    if: github.repository == 'rjdotdev/OpenViking'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # These Python logging tests do not exercise the C++ engine, Rust
      # CLI/RAGFS, or Studio. Keep normal imports and pytest conftest.
      OV_SKIP_CPP_BUILD: '1'
      OV_SKIP_OV_BUILD: '1'
      OV_SKIP_RAGFS_BUILD: '1'
      OV_SKIP_STUDIO_BUILD: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify real Apple Silicon macOS runner
        run: |
          uname -a
          python - <<'PY'
          import platform
          import sys

          print(f"Platform: {platform.platform()}, machine: {platform.machine()}")
          print(f"Python: {sys.version}")
          assert platform.system() == "Darwin", platform.system()
          assert platform.machine() == "arm64", platform.machine()
          assert sys.version_info[:2] == (3, 12), sys.version
          PY

      - uses: astral-sh/setup-uv@v7

      - name: Install locked dependencies and editable source (native builds skipped)
        run: uv sync --frozen --extra test

      - name: Verify checkout imports and native POSIX locking
        run: |
          uv run --frozen --no-sync python - <<'PY'
          import fcntl
          import inspect
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          from openviking_cli.utils import logger, log_rotation
          from openviking.usage_reporter import file_log_sink

          assert os.name == "posix", os.name
          assert inspect.isbuiltin(fcntl.flock), fcntl.flock
          root = Path.cwd().resolve()
          for module in (logger, log_rotation, file_log_sink):
              location = Path(module.__file__).resolve()
              print(f"{module.__name__}: {location}")
              assert location.is_relative_to(root), location
          # A separate real process must not acquire a lock held by production.
          with tempfile.TemporaryDirectory() as directory:
              lock_path = Path(directory) / "rotation.lock"
              probe = '''
          import fcntl, sys
          with open(sys.argv[1], "a") as stream:
              try:
                  fcntl.flock(stream, fcntl.LOCK_EX | fcntl.LOCK_NB)
              except BlockingIOError:
                  sys.exit(0)
              sys.exit(1)
          '''
              with log_rotation.interprocess_lock(lock_path):
                  subprocess.run([sys.executable, "-c", probe, str(lock_path)],
                                 check=True, timeout=10)
          print("Real fcntl cross-process contention verified")
          PY

      - name: Run focused regressions with normal conftest and explicit skip reasons
        run: >-
          uv run --frozen --no-sync pytest -q -ra -o addopts=''
          tests/test_logger_rotation.py
          tests/unit/usage_reporter/test_file_log_sink.py
          --junitxml=macos-log-rotation.xml

      - name: Require the native spawned POSIX regression to pass
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("macos-log-rotation.xml").getroot()
          cases = list(root.iter("testcase"))
          for case in cases:
              for status in ("failure", "error", "skipped"):
                  result = case.find(status)
                  if result is not None:
                      print(f"{status}: {case.get('classname')}.{case.get('name')}: "
                            f"{result.get('message', '')}", flush=True)
          name = "test_worker_processes_keep_post_rollover_records_out_of_backup"
          native = [case for case in cases if case.get("name") == name]
          assert len(native) == 1, f"Expected one native POSIX regression: {native}"
          assert not any(native[0].find(status) is not None
                         for status in ("failure", "error", "skipped")), ET.tostring(native[0])
          print(f"Native spawned POSIX regression passed; {len(cases)} cases reported")
          PY

      - name: Upload pytest JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-log-rotation-${{ github.sha }}
          path: macos-log-rotation.xml
          if-no-files-found: warn
